<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>

<!-- FAVICON -->
<link rel="icon" type="image/webp" href="https://i.postimg.cc/3xpyKyf9/31e9ecb1-a9cd-4218-b431-f90808a6339a.webp">

<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body > canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }

  /* main.js writes its progress and errors into #status as plain text. */
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none; white-space: pre-line;
  }
  #status:empty { display: none; }
  #status::before {
    content: ""; width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid #333; border-top-color: #6fd36f;
    animation: spin 0.9s linear infinite;
  }
  #status.error { color: #ff8a8a; pointer-events: auto; user-select: text; }
  #status.error::before { display: none; }
  
  /* RAINBOW CREDIT STYLE */
  #credit {
    position: fixed; z-index: 1; bottom: 8px; left: 50%;
    transform: translateX(-50%);
    font: bold 14px monospace;
    white-space: nowrap; pointer-events: none;
    background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8f00ff, #ff0000);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: rainbow 3s linear infinite;
  }

  @keyframes rainbow { to { background-position: 200% center; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { 
    #status::before { animation-duration: 3s; }
    #credit { animation: none; background: none; -webkit-text-fill-color: #fff; }
  }
</style>
</head>
<body>
<div id="status">Starting…</div>
<script>
  // Turns the status red when main.js reports that the game could not start.
  (function () {
    var box = document.getElementById("status");
    new MutationObserver(function () {
      box.classList.toggle("error", /could not start|needs WebGPU/.test(box.textContent));
    }).observe(box, { childList: true, characterData: true, subtree: true });
  })();
</script>

<!-- YOUR RAINBOW CREDIT -->
<div id="credit">Webport by Onyx$oul-1</div>

<script type="module" src="main.js"></script>
</body>
</html>
