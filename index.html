<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizon</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body > canvas { display: block; width: 100vw !important; height: 100vh !important; outline: none; }

  /* main.js writes its progress and errors into #status as plain text. */
  #status {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    color: #ddd; font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 16px;
    pointer-events: none; white-space: pre-line;
  }
  #status:empty { display: none; }
  #status::before {
    content: ""; width: 36px; height: 36px; border-radius: 50%;
    border: 4px solid #333; border-top-color: #6fd36f;
    animation: spin 0.9s linear infinite;
  }
  #status.error { color: #ff8a8a; pointer-events: auto; user-select: text; }
  #status.error::before { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #status::before { animation-duration: 3s; } }
</style>
</head>
<body>
<div id="status">Starting…</div>
<script>
  // Turns the status red when main.js reports that the game could not start.
  (function () {
    var box = document.getElementById("status");
    new MutationObserver(function () {
      box.classList.toggle("error", /could not start|needs WebGPU/.test(box.textContent));
    }).observe(box, { childList: true, characterData: true, subtree: true });
  })();
</script>
<script type="module" src="main.js"></script>
</body>
</html>
